<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Script de inicialização do tema (executa antes da renderização) -->
    <script>
      (function() {
        try {
          // Tema salvo pelo usuário nas configurações
          const savedTheme = localStorage.getItem('preferred-theme');

          if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
          } else {
            // Fallback: detecta preferência do sistema
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', prefersDark ? 'berga-black' : 'berga');
          }
        } catch (e) {
          // Em caso de erro (ex.: localStorage bloqueado), usa o tema claro padrão
          document.documentElement.setAttribute('data-theme', 'berga');
        }
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
