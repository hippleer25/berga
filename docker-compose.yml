name: dev_berga

services:
  mysql:
    image: mysql:8.0
    container_name: dev_berga_db
    restart: always
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=8M
      --innodb-log-file-size=64M
      --performance-schema=OFF
      --max-connections=50
      --table-open-cache=64
      --skip-log-bin
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      MYSQL_ROOT_PASSWORD: berga_password
      MYSQL_DATABASE: berga_db
      MYSQL_USER: ${DB_USER:-berga_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
       - "3360:3306"  # Uncomment only for local debugging
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.0  # 'v'-prefixed tag; matches qdrant-client 1.17.0
    container_name: dev_berga_qdrant
    restart: always
    # ports:
    #   - "6333:6333"  # Uncomment only for local debugging
    #   - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__STORAGE__ON_DISK=true
      - QDRANT__STORAGE__HNSW_INDEX__ON_DISK=true
      - QDRANT__STORAGE__OPTIMISERS__DEFAULT_SEGMENT_NUMBER=2
      - QDRANT__STORAGE__OPTIMISERS__MEMORY_MAP_THRESHOLD=10000
      - QDRANT__STORAGE__OPTIMISERS__INDEXING_THRESHOLD=50000
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: dev_berga_redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dev_berga_api
    restart: always
    env_file:
      - .env
    environment:
      - HF_HOME=/home/appuser/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - MALLOC_ARENA_MAX=2
      - OMP_NUM_THREADS=2
      - TOKENIZERS_PARALLELISM=false
    ports:
      - "7546:5746"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - ./backend:/code
      - hf_cache:/home/appuser/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 1200M

  frontend:
    build: ./frontend
    container_name: dev_berga_front
    restart: always
    ports:
      - "6457:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  qdrant_data:
  redis_data:
  hf_cache:
